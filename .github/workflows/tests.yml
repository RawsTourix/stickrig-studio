name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      - name: Window/grid/selection smoke tests (isolated Qt process)
        run: timeout 120s python -X faulthandler -m pytest -vv tests/test_grid_window_selection.py
      - name: Long-flipbook Qt tests in independent native processes
        run: |
          status=0
          for test_name in \
            test_thumbnails_for_11_to_25_are_populated_after_scrolling \
            test_duplicating_last_of_24_frames_keeps_selection_and_scroll_together \
            test_pick_closest_of_two_ankles_at_70_percent_zoom \
            test_shift_resize_is_grid_independent_and_rest_length_can_be_reset; do
            timeout 120s python -X faulthandler -m pytest -vv "tests/test_long_frame_workflow.py::$test_name" || status=1
          done
          exit "$status"
      - name: Unit tests and headless GUI smoke
        run: timeout 120s python -X faulthandler -m pytest -vv --ignore=tests/test_long_frame_workflow.py
